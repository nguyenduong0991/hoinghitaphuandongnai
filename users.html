<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý tài khoản - TGPL Đồng Nai</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary"><div class="container-fluid">
        <span class="navbar-brand mb-0 h1">Quản trị hệ thống</span>
        <a href="index.html" class="btn btn-light btn-sm">Dashboard</a>
    </div></nav>
    <main class="container mt-4">
        <h3>Quản lý tài khoản và vai trò</h3>
        <p class="text-muted">Tài khoản xã/phường chỉ xem hội nghị của đơn vị được gán. Hãy gắn mỗi tài khoản xã/phường với đúng một đơn vị.</p>
        <div id="message" class="mb-3" hidden></div>
        <section class="card mb-4">
            <div class="card-header">Tạo tài khoản xã/phường hoặc quản trị viên</div>
            <form id="userForm" class="card-body row g-3">
                <div class="col-md-4"><label for="fullName" class="form-label">Họ tên</label><input id="fullName" class="form-control" required maxlength="200"></div>
                <div class="col-md-4"><label for="username" class="form-label">Tên đăng nhập</label><input id="username" class="form-control" required minlength="3" maxlength="64" pattern="[A-Za-z0-9._-]+"></div>
                <div class="col-md-4"><label for="password" class="form-label">Mật khẩu tạm (ít nhất 12 ký tự)</label><input id="password" type="password" class="form-control" required minlength="12" autocomplete="new-password"></div>
                <div class="col-md-4"><label for="role" class="form-label">Vai trò</label><select id="role" class="form-select"><option value="COMMUNE">Xã/phường</option><option value="ADMIN">Quản trị viên</option></select></div>
                <div class="col-md-8"><label for="userOrganization" class="form-label">Đơn vị (bắt buộc với tài khoản xã/phường)</label><select id="userOrganization" class="form-select"><option value="">Chọn đơn vị</option></select></div>
                <div class="col-12"><button id="createUserButton" type="submit" class="btn btn-primary">Tạo tài khoản</button></div>
            </form>
        </section>
        <section class="card">
            <div class="card-header">Tài khoản hiện có</div>
            <div class="table-responsive"><table class="table table-hover align-middle mb-0">
                <thead class="table-light"><tr><th>Họ tên</th><th>Tên đăng nhập</th><th>Đơn vị</th><th>Vai trò</th><th>Trạng thái</th><th></th></tr></thead>
                <tbody id="userRows"><tr><td colspan="6" class="text-muted">Đang tải...</td></tr></tbody>
            </table></div>
        </section>
    </main>
    <script src="assets/js/config.js?v=20261004-tunnel-2"></script>
    <script src="assets/js/api.js?v=20261003-unit-scope-1"></script>
    <script src="assets/js/auth.js"></script>
    <script>
        const form = document.getElementById("userForm");
        const rows = document.getElementById("userRows");
        const message = document.getElementById("message");
        const orgSelect = document.getElementById("userOrganization");

        function showMessage(text, type = "success") {
            message.className = `alert alert-${type} mb-3`;
            message.textContent = text;
            message.hidden = false;
        }

        async function loadUsers() {
            try {
                const [userResult, organizationResult] = await Promise.all([getUsers(), getOrganizations()]);
                orgSelect.replaceChildren();
                const emptyOption = document.createElement("option"); emptyOption.value = ""; emptyOption.textContent = "Chọn đơn vị"; orgSelect.appendChild(emptyOption);
                (organizationResult.data || []).forEach(org => {
                    const option = document.createElement("option");
                    option.value = org.id;
                    option.textContent = org.name;
                    orgSelect.appendChild(option);
                });
                rows.replaceChildren();
                (userResult.data || []).forEach(user => {
                    const row = document.createElement("tr");
                    const name = row.insertCell(); name.textContent = user.full_name;
                    const username = row.insertCell(); username.textContent = user.username;
                    const organizationCell = row.insertCell();
                    const organization = document.createElement("select"); organization.className = "form-select form-select-sm";
                    const noOrganization = document.createElement("option"); noOrganization.value = ""; noOrganization.textContent = "Chọn đơn vị"; organization.appendChild(noOrganization);
                    (organizationResult.data || []).forEach(org => { const option = document.createElement("option"); option.value = org.id; option.textContent = org.name; organization.appendChild(option); });
                    organization.value = user.organization_id || ""; organizationCell.appendChild(organization);
                    const roleCell = row.insertCell();
                    const role = document.createElement("select"); role.className = "form-select form-select-sm";
                    [["COMMUNE", "Xã/phường"], ["ADMIN", "Quản trị viên"]].forEach(([value, label]) => {
                        const option = document.createElement("option"); option.value = value; option.textContent = label; role.appendChild(option);
                    });
                    role.value = user.role; roleCell.appendChild(role);
                    const activeCell = row.insertCell();
                    const active = document.createElement("input"); active.type = "checkbox"; active.className = "form-check-input"; active.checked = user.is_active;
                    active.setAttribute("aria-label", `Tài khoản ${user.username} đang hoạt động`); activeCell.appendChild(active);
                    const actionCell = row.insertCell();
                    const save = document.createElement("button"); save.type = "button"; save.className = "btn btn-sm btn-outline-primary"; save.textContent = "Lưu";
                    save.addEventListener("click", async () => {
                        save.disabled = true;
                        try { await updateUser(user.id, { role: role.value, is_active: active.checked, organization_id: organization.value || null }); showMessage(`Đã cập nhật ${user.username}.`); await loadUsers(); }
                        catch (error) { showMessage(error.message || "Không cập nhật được tài khoản.", "danger"); save.disabled = false; }
                    });
                    actionCell.appendChild(save);
                    rows.appendChild(row);
                });
                if (!rows.children.length) {
                    const row = rows.insertRow(); const cell = row.insertCell(); cell.colSpan = 6; cell.textContent = "Chưa có tài khoản.";
                }
            } catch (error) { showMessage(error.message || "Không tải được danh sách tài khoản.", "danger"); }
        }

        form.addEventListener("submit", async event => {
            event.preventDefault();
            const button = document.getElementById("createUserButton"); button.disabled = true;
            try {
                await createUser({
                    full_name: document.getElementById("fullName").value.trim(),
                    username: document.getElementById("username").value.trim(),
                    password: document.getElementById("password").value,
                    role: document.getElementById("role").value,
                    organization_id: orgSelect.value || null
                });
                form.reset(); showMessage("Đã tạo tài khoản."); await loadUsers();
            } catch (error) { showMessage(error.message || "Không tạo được tài khoản.", "danger"); }
            finally { button.disabled = false; }
        });

        const createRole = document.getElementById("role");
        createRole.addEventListener("change", () => { orgSelect.required = createRole.value === "COMMUNE"; });
        orgSelect.required = createRole.value === "COMMUNE";

        loadUsers();
    </script>
</body>
</html>
