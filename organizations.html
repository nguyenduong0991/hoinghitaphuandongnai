<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý đơn vị - TGPL Đồng Nai</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">Phần mềm quản lý hội nghị TGPL</span>
            <a href="conference-list.html" class="btn btn-light btn-sm">Danh sách hội nghị</a>
        </div>
    </nav>
    <main class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div><h3>Quản lý đơn vị</h3><p class="text-muted mb-0">Thêm các đơn vị đăng ký hội nghị.</p></div>
            <a href="create-conference.html" class="btn btn-outline-primary">Đăng ký hội nghị</a>
        </div>
        <div id="message" class="mb-3" hidden></div>
        <section class="card mb-4">
            <div class="card-header">Thêm đơn vị</div>
            <form id="organizationForm" class="card-body d-flex gap-2 admin-only">
                <label class="visually-hidden" for="organizationName">Tên đơn vị</label>
                <input id="organizationName" class="form-control" maxlength="160" placeholder="Nhập tên đơn vị" required>
                <button class="btn btn-primary text-nowrap" type="submit">Thêm</button>
            </form>
        </section>
        <section class="card">
            <div class="card-header">Danh sách đơn vị</div>
            <div class="table-responsive"><table class="table table-hover align-middle mb-0">
                <thead class="table-light"><tr><th>Tên đơn vị</th><th>Ngày tạo</th></tr></thead>
                <tbody id="organizationRows"><tr><td colspan="2" class="text-muted">Đang tải...</td></tr></tbody>
            </table></div>
        </section>
    </main>
    <script src="assets/js/config.js?v=20261003-analytics-1"></script>
    <script src="assets/js/api.js?v=20261003-reschedule-1"></script>
    <script src="assets/js/auth.js"></script>
    <script>
        const form = document.getElementById("organizationForm");
        const rows = document.getElementById("organizationRows");
        const message = document.getElementById("message");

        function showMessage(text, type = "success") {
            message.className = `alert alert-${type} mb-3`;
            message.textContent = text;
            message.hidden = false;
        }

        async function loadOrganizations() {
            try {
                const result = await getOrganizations();
                rows.replaceChildren();
                const organizations = result.data || [];
                if (!organizations.length) {
                    const row = rows.insertRow();
                    const cell = row.insertCell();
                    cell.colSpan = 2;
                    cell.className = "text-muted";
                    cell.textContent = "Chưa có đơn vị. Hãy thêm đơn vị trước khi đăng ký hội nghị.";
                    return;
                }
                organizations.forEach(organization => {
                    const row = rows.insertRow();
                    const nameCell = row.insertCell();
                    nameCell.textContent = organization.name;
                    const dateCell = row.insertCell();
                    dateCell.textContent = organization.created_at
                        ? new Date(organization.created_at).toLocaleDateString("vi-VN")
                        : "";
                });
            } catch (error) {
                rows.replaceChildren();
                showMessage(error.message || "Không tải được danh sách đơn vị.", "danger");
            }
        }

        form.addEventListener("submit", async event => {
            event.preventDefault();
            const button = form.querySelector("button[type=submit]");
            button.disabled = true;
            try {
                await createOrganization(document.getElementById("organizationName").value.trim());
                form.reset();
                showMessage("Đã thêm đơn vị.");
                await loadOrganizations();
            } catch (error) {
                showMessage(error.message || "Không thêm được đơn vị.", "danger");
            } finally {
                button.disabled = false;
            }
        });

        loadOrganizations();
    </script>
</body>
</html>
