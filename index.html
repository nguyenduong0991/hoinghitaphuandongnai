<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Hệ thống Hội nghị TGPL Thành phố Đồng Nai</title>

    <!-- Bootstrap -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- CSS của hệ thống -->
    <link
        rel="stylesheet"
        href="assets/css/style.css"
    >
</head>

<body>

    <!-- =========================
         SIDEBAR
    ========================== -->

    <div class="sidebar">

        <h4 class="p-3">
            ⚖️ TGPL
            <br>
            TP. Đồng Nai
        </h4>

        <a href="index.html">
            <i class="bi bi-speedometer2"></i>
            Dashboard
        </a>

        <a href="create-conference.html">
            <i class="bi bi-plus-circle"></i>
            Tạo hội nghị
        </a>

        <a href="conference-list.html">
            <i class="bi bi-card-list"></i>
            Danh sách hội nghị
        </a>

    </div>


    <!-- =========================
         NỘI DUNG CHÍNH
    ========================== -->

    <div class="content">

        <h2>
            Hệ thống Điều phối Hội nghị TGPL
        </h2>

        <p class="text-muted">
            Trung tâm Trợ giúp pháp lý Nhà nước
            Thành phố Đồng Nai
        </p>


        <!-- =========================
             KPI
        ========================== -->

        <div id="connectionError" class="mb-3" style="display:none;"></div>

        <div class="row g-3">

            <!-- Tổng hồ sơ -->
            <div class="col-md-3">

                <div class="card card-kpi bg-primary text-white">

                    <div class="card-body">

                        <h6>
                            Tổng hồ sơ
                        </h6>

                        <h2 id="totalConferences">
                            0
                        </h2>

                    </div>

                </div>

            </div>


            <!-- Chờ phê duyệt -->
            <div class="col-md-3">

                <div class="card card-kpi bg-warning">

                    <div class="card-body">

                        <h6>
                            Chờ phê duyệt
                        </h6>

                        <h2 id="pendingConferences">
                            0
                        </h2>

                    </div>

                </div>

            </div>


            <!-- Đã phê duyệt -->
            <div class="col-md-3">

                <div class="card card-kpi bg-success text-white">

                    <div class="card-body">

                        <h6>
                            Đã phê duyệt
                        </h6>

                        <h2 id="approvedConferences">
                            0
                        </h2>

                    </div>

                </div>

            </div>


            <!-- Hoàn thành -->
            <div class="col-md-3">

                <div class="card card-kpi bg-danger text-white">

                    <div class="card-body">

                        <h6>
                            Hoàn thành
                        </h6>

                        <h2 id="completedConferences">
                            0
                        </h2>

                    </div>

                </div>

            </div>

        </div>


        <!-- =========================
             BIỂU ĐỒ
        ========================== -->

        <div class="card mt-4">

            <div class="card-header">
                Thống kê hồ sơ
            </div>

            <div class="card-body">

                <div class="chart-container"><canvas id="statusChart" aria-label="Biểu đồ trạng thái hội nghị"></canvas></div>

            </div>

        </div>


        <!-- =========================
             HỒ SƠ GẦN ĐÂY
        ========================== -->

        <div class="card mt-4">

            <div class="card-header">
                Hồ sơ gần đây
            </div>

            <div class="card-body">

                <div class="table-responsive">

                    <table class="table table-bordered table-hover">

                        <thead>

                            <tr>
                                <th>Mã</th>
                                <th>Chủ đề</th>
                                <th>Đơn vị</th>
                                <th>Trạng thái</th>
                                <th>Thao tác</th>
                            </tr>

                        </thead>

                        <tbody id="recentTable">

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>


    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- JavaScript của hệ thống -->
    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/app.js"></script>

</body>
</html>
