<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng ký Hội nghị TGPL</title><style>body{font-family:Arial;margin:20px;background:#f4f6f9}input,textarea,select{width:100%;padding:8px;margin:4px 0}button{padding:10px 15px;background:#0b65c2;color:#fff;border:none;border-radius:4px}table{width:100%;border-collapse:collapse;background:#fff}th,td{border:1px solid #ddd;padding:8px} .card{background:#fff;padding:15px;border-radius:8px;margin-bottom:15px}</style></head><body><h2>Phần mềm Đăng ký Hội nghị Trợ giúp pháp lý</h2><div class="card"><h3>Tạo đăng ký</h3><input id="donvi" placeholder="Đơn vị"><input id="chude" placeholder="Chủ đề"><input id="thoigian" type="date"><input id="diadiem" placeholder="Địa điểm"><select id="trangthai"><option>Mới đăng ký</option><option>Đang xem xét</option><option>Đã phê duyệt</option><option>Đã hoàn thành</option></select><button onclick="save()">Lưu</button></div><div class="card"><h3>Danh sách</h3><table><thead><tr><th>Đơn vị</th><th>Chủ đề</th><th>Thời gian</th><th>Địa điểm</th><th>Trạng thái</th></tr></thead><tbody id="tb"></tbody></table></div><script>function load(){let d=JSON.parse(localStorage.getItem('hn')||'[]');tb.innerHTML=d.map(x=>`<tr><td>${x.donvi}</td><td>${x.chude}</td><td>${x.tg}</td><td>${x.dd}</td><td>${x.tt}</td></tr>`).join('')}function save(){let d=JSON.parse(localStorage.getItem('hn')||'[]');d.push({donvi:donvi.value,chude:chude.value,tg:thoigian.value,dd:diadiem.value,tt:trangthai.value});localStorage.setItem('hn',JSON.stringify(d));load();alert('Đã lưu');}load();</script></body></html><!-- rebuild -->
