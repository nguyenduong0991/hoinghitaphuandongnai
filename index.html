<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Hệ thống Hội nghị TGPL Thành phố Đồng Nai</title>

<link hrefn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1..css

https://cdn.jsdelivr.net/npm/chart.jsscript>

<style>

body{
    background:#f4f6f9;
    font-family:Arial, sans-serif;
}

.sidebar{
    width:250px;
    height:100vh;
    position:fixed;
    left:0;
    top:0;

    background:#0d6efd;
    color:white;
}

.sidebar h4{
    padding:20px;
}

.sidebar a{
    display:block;
    color:white;
    text-decoration:none;
    padding:12px 20px;
}

.sidebar a:hover{
    background:rgba(255,255,255,.15);
}

.content{
    margin-left:250px;
    padding:20px;
}

.card-kpi{
    border:none;
    border-radius:12px;
}

</style>

</head>

<body>

<div class="sidebar">

    <h4>
        ⚖️ TGPL
        <br>
        TP. Đồng Nai
    </h4>

    <a href="index.html">
        <i class="bi bi-speedometer2"></i>
        Dashboard
    </a>

    <a href="create-conference.html">
        <i class="bi bi-plus-circle"></i>
        Tạo hội nghị
    </a>

    <a href="conference-list.html">
        <i class="bi bi-card-list"></i>
        Danh sách hội nghị
    </a>

</div>

<div class="content">

    <h2>
        Hệ thống Điều phối Hội nghị TGPL
    </h2>

    <p class="text-muted">
        Trung tâm Trợ giúp pháp lý Nhà nước
        Thành phố Đồng Nai
    </p>

    <div class="row g-3">

        <div class="col-md-3">

            <div class="card card-kpi bg-primary text-white">

                <div class="card-body">

                    <h6>Tổng hồ sơ</h6>

                    <h2 id="totalConference">
                        0
                    </h2>

                </div>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card card-kpi bg-warning">

                <div class="card-body">

                    <h6>Chờ duyệt</h6>

                    <h2 id="pendingConference">
                        0
                    </h2>

                </div>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card card-kpi bg-success text-white">

                <div class="card-body">

                    <h6>Đã duyệt</h6>

                    <h2 id="approvedConference">
                        0
                    </h2>

                </div>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card card-kpi bg-danger text-white">

                <div class="card-body">

                    <h6>Hoàn thành</h6>

                    <h2 id="completedConference">
                        0
                    </h2>

                </div>

            </div>

        </div>

    </div>

    <div class="card mt-4">

        <div class="card-header">
            Thống kê hồ sơ
        </div>

        <div class="card-body">

            <canvas id="statusChart"></canvas>

        </div>

    </div>

    <div class="card mt-4">

        <div class="card-header">
            Hồ sơ gần đây
        </div>

        <div class="card-body">

            <table class="table table-bordered">

                <thead>

                <tr>

                    <th>Mã</th>
                    <th>Chủ đề</th>
                    <th>Đơn vị</th>
                    <th>Trạng thái</th>

                </tr>

                </thead>

                <tbody id="recentTable">

                </tbody>

            </table>

        </div>

    </div>

</div>

assets/js/app.jsscript>

<script>

const data =
    JSON.parse(
        localStorage.getItem(
            "conferenceList"
        ) || "[]"
    );

document.getElementById(
    "totalConference"
).innerText =
    data.length;

const pending =
data.filter(
x => x.status==="Chờ phê duyệt"
).length;

const approved =
data.filter(
x => x.status==="Đã phê duyệt"
).length;

const completed =
data.filter(
x => x.status==="Hoàn thành"
).length;

document.getElementById(
"pendingConference"
).innerText = pending;

document.getElementById(
"approvedConference"
).innerText = approved;

document.getElementById(
"completedConference"
).innerText = completed;

new Chart(
document.getElementById(
"statusChart"),
{
type:"pie",

data:
{
labels:[
"Chờ duyệt",
"Đã duyệt",
"Hoàn thành"
],

datasets:[
{
data:[
pending,
approved,
completed
]
}]
}
});

let html = "";

data.slice(-10)
.reverse()
.forEach(item => {

html += `
<tr>

<td>${item.code || ""}</td>

<td>${item.topic || ""}</td>

<td>${item.organization || ""}</td>

<td>${item.status || ""}</td>

</tr>
`;

});

document.getElementById(
"recentTable"
).innerHTML = html;

</script>

</body>
</html>
