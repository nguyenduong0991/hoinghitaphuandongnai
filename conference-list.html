<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Danh sách hội nghị - TGPL Đồng Nai</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="assets/css/style.css">
</head>

<body>

    <!-- HEADER -->
    <nav class="navbar navbar-dark bg-primary">
        <div class="container-fluid">

            <span class="navbar-brand mb-0 h1">
                Phần mềm quản lý hội nghị TGPL
            </span>

            <a
                href="index.html"
                class="btn btn-light btn-sm">
                Dashboard
            </a>

        </div>
    </nav>


    <!-- MAIN -->
    <div class="container-fluid mt-4">

        <div class="d-flex justify-content-between align-items-center mb-3">

            <div>
                <h3>Danh sách hội nghị</h3>

                <p class="text-muted mb-0">
                    Quản lý các hội nghị đã đăng ký trên hệ thống
                </p>
            </div>

            <a
                href="create-conference.html"
                class="btn btn-primary">

                + Đăng ký hội nghị

            </a>

        </div>


        <!-- THÔNG BÁO -->
        <div id="connectionError"
             style="display:none;">
        </div>

        <section id="conferenceDetail" class="card mb-4" hidden aria-live="polite">
            <div class="card-header d-flex justify-content-between align-items-center">
                <strong>Chi tiết hội nghị</strong>
                <button id="closeDetail" type="button" class="btn btn-sm btn-outline-secondary">Đóng</button>
            </div>
            <div id="conferenceDetailBody" class="card-body"></div>
        </section>


        <!-- BỘ LỌC -->
        <div class="card mb-4">

            <div class="card-header">
                Bộ lọc
            </div>

            <div class="card-body">

                <div class="row g-3">

                    <div class="col-md-4">

                        <label
                            for="searchInput"
                            class="form-label">

                            Tìm kiếm

                        </label>

                        <input
                            type="text"
                            id="searchInput"
                            class="form-control"
                            placeholder="Mã hoặc chủ đề hội nghị">

                    </div>


                    <div class="col-md-3">

                        <label
                            for="statusFilter"
                            class="form-label">

                            Trạng thái

                        </label>

                        <select
                            id="statusFilter"
                            class="form-select">

                            <option value="">
                                Tất cả
                            </option>

                            <option value="PENDING">
                                Chờ phê duyệt
                            </option>

                            <option value="APPROVED">
                                Đã phê duyệt
                            </option>

                            <option value="COMPLETED">
                                Hoàn thành
                            </option>

                            <option value="REJECTED">
                                Từ chối
                            </option>

                            <option value="CANCELLED">
                                Đã hủy
                            </option>

                        </select>

                    </div>


                    <div class="col-md-2 d-flex align-items-end">

                        <button
                            id="resetFilter"
                            class="btn btn-secondary w-100">

                            Xóa lọc

                        </button>

                    </div>

                </div>

            </div>

        </div>


        <!-- DANH SÁCH -->
        <div class="card">

            <div class="card-header d-flex justify-content-between">

                <span>
                    Danh sách hội nghị
                </span>

                <span
                    id="conferenceCount"
                    class="badge bg-primary">

                    0

                </span>

            </div>


            <div class="card-body">

                <div class="table-responsive">

                    <table
                        class="table table-bordered table-hover align-middle">

                        <thead class="table-light">

                            <tr>

                                <th>
                                    Mã
                                </th>

                                <th>
                                    Chủ đề
                                </th>

                                <th>
                                    Đơn vị
                                </th>

                                <th>
                                    Thời gian
                                </th>

                                <th>
                                    Số người dự kiến
                                </th>

                                <th>
                                    Trạng thái
                                </th>

                                <th
                                    style="width:120px;">
                                    Thao tác
                                </th>

                            </tr>

                        </thead>


                        <tbody id="conferenceTableBody">

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>


    <!-- JAVASCRIPT -->

    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/attachments.js"></script>


    <script>

        let allConferences = [];


        // ==================================================
        // KHỞI TẠO
        // ==================================================

        document.addEventListener(
            "DOMContentLoaded",
            async function () {

                console.log(
                    "Đang tải danh sách hội nghị..."
                );


                try {

                    const result =
                        await getConferences();


                    console.log(
                        "Danh sách hội nghị:",
                        result
                    );


                    allConferences =
                        result.data || [];


                    renderConferences(
                        allConferences
                    );


                    setupFilters();
                    loadConferenceDetailFromUrl();


                } catch (error) {

                    console.error(
                        "Lỗi tải danh sách hội nghị:",
                        error
                    );


                    showListError(error);

                }

            }
        );


        // ==================================================
        // HIỂN THỊ DANH SÁCH
        // ==================================================

        function renderConferences(
            conferences
        ) {

            const tableBody =
                document.getElementById(
                    "conferenceTableBody"
                );


            const countElement =
                document.getElementById(
                    "conferenceCount"
                );


            if (!tableBody) {

                return;

            }


            tableBody.innerHTML = "";


            if (countElement) {

                countElement.textContent =
                    conferences.length;

            }


            if (
                conferences.length === 0
            ) {

                tableBody.innerHTML = `

                    <tr>

                        <td
                            colspan="7"
                            class="text-center text-muted">

                            Không có hội nghị phù hợp.

                        </td>

                    </tr>

                `;

                return;

            }


            conferences.forEach(
                function (conference) {

                    const row =
                        document.createElement("tr");


                    row.innerHTML = `

                        <td>
                            ${escapeHtml(
                                conference.code || ""
                            )}
                        </td>


                        <td>
                            ${escapeHtml(
                                conference.title || ""
                            )}
                        </td>


                        <td>
                            ${escapeHtml(
                                conference.organization_name ||
                                conference.organization_id ||
                                ""
                            )}
                        </td>


                        <td>
                            ${formatDateTime(
                                conference.start_time
                            )}

                            <br>

                            <small
                                class="text-muted">

                                đến

                                ${formatDateTime(
                                    conference.end_time
                                )}

                            </small>

                        </td>


                        <td>
                            ${escapeHtml(
                                conference.expected_participants ??
                                ""
                            )}
                        </td>


                        <td>
                            ${getStatusBadge(
                                conference.status
                            )}
                        </td>


                        <td>

                            <a
                                href="conference-list.html?id=${encodeURIComponent(
                                    conference.id
                                )}"
                                class="btn btn-sm btn-primary">

                                Xem

                            </a>

                        </td>

                    `;


                    tableBody.appendChild(row);

                }
            );

        }

        async function loadConferenceDetailFromUrl() {
            const id = new URLSearchParams(window.location.search).get("id");
            if (!id) return;
            const panel = document.getElementById("conferenceDetail");
            const body = document.getElementById("conferenceDetailBody");
            panel.hidden = false;
            body.innerHTML = '<p class="text-muted mb-0">Đang tải thông tin...</p>';
            document.getElementById("closeDetail").addEventListener("click", function () {
                panel.hidden = true;
                history.replaceState({}, "", "conference-list.html");
            }, { once: true });
            try {
                const result = await getConference(id);
                const item = result.data || result;
                body.innerHTML = `
                    <div class="row g-3">
                        <div class="col-md-6"><small class="text-muted">Mã hội nghị</small><div class="fw-semibold">${escapeHtml(item.code || "")}</div></div>
                        <div class="col-md-6"><small class="text-muted">Trạng thái</small><div>${getStatusBadge(item.status)}</div></div>
                        <div class="col-md-12"><small class="text-muted">Chủ đề</small><div class="fw-semibold">${escapeHtml(item.title || "")}</div></div>
                        <div class="col-md-6"><small class="text-muted">Đơn vị đăng ký</small><div>${escapeHtml(item.organization_name || "")}</div></div>
                        <div class="col-md-6"><small class="text-muted">Địa điểm</small><div>${escapeHtml(item.location_name || item.location_address || "Chưa cập nhật")}</div></div>
                        <div class="col-md-6"><small class="text-muted">Bắt đầu</small><div>${escapeHtml(formatDateTime(item.start_time))}</div></div>
                        <div class="col-md-6"><small class="text-muted">Kết thúc</small><div>${escapeHtml(formatDateTime(item.end_time))}</div></div>
                        <div class="col-md-6"><small class="text-muted">Số người dự kiến</small><div>${escapeHtml(item.expected_participants ?? 0)}</div></div>
                        <div class="col-12"><small class="text-muted">Nội dung / mục đích</small><div>${escapeHtml(item.description || "Chưa cập nhật")}</div></div>
                        <div class="col-12"><small class="text-muted">Tệp đính kèm</small><div id="conferenceAttachments" class="mt-2"><span class="text-muted">Đang tải danh sách tệp...</span></div></div>
                    </div>`;
                renderConferenceAttachments(item.id);
            } catch (error) {
                body.innerHTML = `<div class="alert alert-danger mb-0">${escapeHtml(error.message || "Không tải được chi tiết hội nghị.")}</div>`;
            }
        }

        async function renderConferenceAttachments(conferenceId) {
            const list = document.getElementById("conferenceAttachments");
            if (!list) return;
            try {
                const attachments = await getConferenceAttachments(conferenceId);
                list.replaceChildren();
                if (!attachments.length) {
                    list.textContent = "Chưa có tệp đính kèm.";
                    return;
                }
                attachments.forEach(function (attachment) {
                    const button = document.createElement("button");
                    button.type = "button";
                    button.className = "btn btn-sm btn-outline-primary me-2 mb-2";
                    button.textContent = `${attachment.name || attachment.file_name || "Tệp"} (${formatFileSize(attachment.size || attachment.file_size || 0)})`;
                    button.addEventListener("click", function () {
                        openConferenceAttachment(attachment).catch(error => alert(error.message));
                    });
                    list.appendChild(button);
                });
            } catch (error) {
                list.textContent = error.message || "Không tải được danh sách tệp.";
            }
        }


        // ==================================================
        // BỘ LỌC
        // ==================================================

        function setupFilters() {

            const searchInput =
                document.getElementById(
                    "searchInput"
                );


            const statusFilter =
                document.getElementById(
                    "statusFilter"
                );


            const resetButton =
                document.getElementById(
                    "resetFilter"
                );


            searchInput.addEventListener(
                "input",
                applyFilters
            );


            statusFilter.addEventListener(
                "change",
                applyFilters
            );


            resetButton.addEventListener(
                "click",
                function () {

                    searchInput.value = "";

                    statusFilter.value = "";

                    renderConferences(
                        allConferences
                    );

                }
            );

        }


        function applyFilters() {

            const keyword =
                document.getElementById(
                    "searchInput"
                ).value
                .trim()
                .toLowerCase();


            const status =
                document.getElementById(
                    "statusFilter"
                ).value;


            const filtered =
                allConferences.filter(
                    function (conference) {

                        const code =
                            String(
                                conference.code || ""
                            ).toLowerCase();


                        const title =
                            String(
                                conference.title || ""
                            ).toLowerCase();


                        const matchesKeyword =
                            !keyword ||
                            code.includes(keyword) ||
                            title.includes(keyword);


                        const matchesStatus =
                            !status ||
                            conference.status === status;


                        return (
                            matchesKeyword &&
                            matchesStatus
                        );

                    }
                );


            renderConferences(
                filtered
            );

        }


        // ==================================================
        // TRẠNG THÁI
        // ==================================================

        function getStatusBadge(status) {

            const statusMap = {

                PENDING: {
                    text: "Chờ phê duyệt",
                    className:
                        "bg-warning text-dark"
                },

                APPROVED: {
                    text: "Đã phê duyệt",
                    className:
                        "bg-success"
                },

                COMPLETED: {
                    text: "Hoàn thành",
                    className:
                        "bg-primary"
                },

                REJECTED: {
                    text: "Từ chối",
                    className:
                        "bg-danger"
                },

                CANCELLED: {
                    text: "Đã hủy",
                    className:
                        "bg-secondary"
                }

            };


            const item =
                statusMap[status] || {

                    text:
                        status ||
                        "Không xác định",

                    className:
                        "bg-secondary"

                };


            return `

                <span
                    class="badge ${item.className}">

                    ${item.text}

                </span>

            `;

        }


        // ==================================================
        // ĐỊNH DẠNG NGÀY GIỜ
        // ==================================================

        function formatDateTime(value) {

            if (!value) {

                return "";

            }


            const date =
                new Date(value);


            if (
                Number.isNaN(
                    date.getTime()
                )
            ) {

                return value;

            }


            return date.toLocaleString(
                "vi-VN",
                {

                    day: "2-digit",

                    month: "2-digit",

                    year: "numeric",

                    hour: "2-digit",

                    minute: "2-digit"

                }
            );

        }


        // ==================================================
        // XỬ LÝ HTML
        // ==================================================

        function escapeHtml(value) {

            if (
                value === null ||
                value === undefined
            ) {

                return "";

            }


            return String(value)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        // ==================================================
        // LỖI
        // ==================================================

        function showListError(error) {

            const errorElement =
                document.getElementById(
                    "connectionError"
                );


            if (!errorElement) {

                return;

            }


            errorElement.innerHTML = `

                <div
                    class="alert alert-danger">

                    <strong>
                        Không tải được danh sách hội nghị.
                    </strong>

                    <br>

                    ${escapeHtml(
                        error.message ||
                        "Lỗi không xác định"
                    )}

                </div>

            `;


            errorElement.style.display =
                "block";

        }

    </script>

</body>

</html>
