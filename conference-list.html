<!DOCTYPE html>
<html lang="vi">

<head>

<body>

    <!-- HEADER -->

        <div class="container-fluid">

    <!-- MAIN -->

        <div class="d-flex justify-content-between align-items-center mb-3">

        <!-- THÔNG BÁO -->
        <div id="connectionError"
             style="display:none;">
        </div>

        <section id="conferenceDetail" class="card mb-4" hidden aria-live="polite">
            <div class="card-header d-flex justify-content-between align-items-center">
                <strong>Chi tiết hội nghị</strong>
                <button id="closeDetail" type="button" class="btn btn-sm btn-outline-secondary">Đóng</button>

            <div id="conferenceDetailBody" class="card-body"></div>

        <!-- BỘ LỌC -->
        <div class="card mb-4">

            <div class="card-header">
                Bộ lọc
            </div>

            <div class="card-body">

                <div class="row g-3">

                    <div class="col-md-4">

                        <label
                            for="searchInput"
                            class="form-label">

                            Tìm kiếm

                        </label>

                        <input
                            type="text"
                            id="searchInput"
                            class="form-control"

                    </div>


                    <div class="col-md-3">

                        <label
                            for="statusFilter"

                            Trạng thái

                        </label>

                        <select
                            id="statusFilter"
                            class="form-select">

                            <option value="">
                                Tất cả
                            </option>

                            <option value="PENDING">
                                Chờ phê duyệt
                            </option>

                            <option value="APPROVED">
                                Đã phê duyệt
                            </option>

                            <option value="COMPLETED">
                                Hoàn thành
                            </option>

                            <option value="REJECTED">
                                Từ chối
                            </option>

                            <option value="CANCELLED">
                                Đã hủy
                            </option>
                            <option value="RESCHEDULED">
                                Đề xuất dời lịch
                            </option>

                        </select>

                    </div>


                    <div class="col-md-2 d-flex align-items-end">

                        <button
                            id="resetFilter"
                            class="btn btn-secondary w-100">

                            Xóa lọc

                        </button>

                    </div>

                </div>

            </div>

        </div>


        <!-- DANH SÁCH -->
        <div class="card">

            <div class="card-header d-flex justify-content-between">

                <div class="d-flex align-items-center gap-2">
                    Danh sách hội nghị
                    <a href="organizations.html" class="btn btn-sm btn-outline-primary">Đơn vị</a>
                    <button id="exportCsv" type="button" class="btn btn-sm btn-outline-success">Xuất CSV</button>
                </div>

                <span
                    id="conferenceCount"
                    class="badge bg-primary">

                    0

                </span>

            </div>


            <div class="card-body">

                <div class="table-responsive">

                    <table
                        class="table table-bordered table-hover align-middle">

                        <thead class="table-light">

                            <tr>

                                <th>
                                    Mã
                                </th>

                                <th>
                                    Chủ đề
                                </th>

                                <th>
                                    Đơn vị
                                </th>

                                <th>
                                    Thời gian
                                </th>

                                <th>
                                    Số người dự kiến
                                </th>

                                <th>
                                    Trạng thái
                                </th>

                                <th
                                    style="width:120px;">
                                    Thao tác
                                </th>

                            </tr>

                        </thead>


                        <tbody id="conferenceTableBody">

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>


    <!-- JAVASCRIPT -->

    <script src="assets/js/config.js?v=20261003-analytics-1"></script>
    <script src="assets/js/api.js?v=20261003-reschedule-1"></script>
    <script src="assets/js/attachments.js?v=20261003-3"></script>
    <script src="assets/js/auth.js"></script>


    <script>

        let allConferences = [];
        let visibleConferences = [];


        // ==================================================
        // KHỞI TẠO
        // ==================================================

        document.addEventListener(
            "DOMContentLoaded",
            async function () {

                console.log(
                    "Đang tải danh sách hội nghị..."
                );


                try {

                    const result =
                        await getConferences();


                    console.log(
                        "Danh sách hội nghị:",
                        result
                    );


                    allConferences =
                        result.data || [];


                    renderConferences(
                        allConferences
                    );


                    setupFilters();
                    loadConferenceDetailFromUrl();


                } catch (error) {

                    console.error(
                        "Lỗi tải danh sách hội nghị:",
                        error
                    );


                    showListError(error);

                }

            }
        );


        // ==================================================
        // HIỂN THỊ DANH SÁCH
        // ==================================================

        function renderConferences(
            conferences
        ) {

            const tableBody =
                document.getElementById(
                    "conferenceTableBody"
                );


            const countElement =
                document.getElementById(
                    "conferenceCount"
                );


            if (!tableBody) {

                return;

            }


            tableBody.innerHTML = "";
            visibleConferences = [...conferences];


            if (countElement) {

                countElement.textContent =
                    conferences.length;

            }


            if (
                conferences.length === 0
            ) {

                tableBody.innerHTML = `

                    <tr>

                        <td
                            colspan="7"
                            class="text-center text-muted">

                            Không có hội nghị phù hợp.

                        </td>

                    </tr>

                `;

                return;

            }


            conferences.forEach(
                function (conference) {

                    const row =
                        document.createElement("tr");


                    row.innerHTML = `

                        <td>
                            ${escapeHtml(
                                conference.code || ""
                            )}
                        </td>


                        <td>
                            ${escapeHtml(
                                conference.title || ""
                            )}
                        </td>


                        <td>
                            ${escapeHtml(
                                conference.organization_name ||
                                conference.organization_id ||
                                ""
                            )}
                        </td>


                        <td>
                            ${formatDateTime(
                                conference.start_time
                            )}

                            <br>

                            <small
                                class="text-muted">

                                đến

                                ${formatDateTime(
                                    conference.end_time
                                )}

                            </small>

                        </td>


                        <td>
                            ${escapeHtml(
                                conference.expected_participants ??
                                ""
                            )}
                        </td>


                        <td>
                            ${getStatusBadge(
                                conference.status
                            )}
                        </td>


                        <td>

                            <a
                                href="conference-list.html?id=${encodeURIComponent(
                                    conference.id
                                )}"
                                class="btn btn-sm btn-primary">

                                Xem

                            </a>

                        </td>

                    `;


                    tableBody.appendChild(row);

                }
            );

        }

        async function loadConferenceDetailFromUrl() {
            const id = new URLSearchParams(window.location.search).get("id");
            if (!id) return;
            const panel = document.getElementById("conferenceDetail");
            const body = document.getElementById("conferenceDetailBody");
            panel.hidden = false;
            body.innerHTML = '<p class="text-muted mb-0">Đang tải thông tin...</p>';
            document.getElementById("closeDetail").addEventListener("click", function () {
                panel.hidden = true;
                history.replaceState({}, "", "conference-list.html");
            }, { once: true });
            try {
                const result = await getConference(id);
                const item = result.data || result;
                let currentUser = null;
                try { currentUser = JSON.parse(localStorage.getItem("tgpl.user") || "null"); } catch { currentUser = null; }
                body.innerHTML = `
                    <div class="row g-3">
                        <div class="col-md-6"><small class="text-muted">Mã hội nghị</small><div class="fw-semibold">${escapeHtml(item.code || "")}</div></div>
                        <div class="col-md-6"><small class="text-muted">Trạng thái</small><div id="detailStatusBadge">${getStatusBadge(item.status)}</div></div>
                        <div class="col-md-12"><small class="text-muted">Chủ đề</small><div class="fw-semibold">${escapeHtml(item.title || "")}</div></div>
                        <div class="col-md-6"><small class="text-muted">Đơn vị đăng ký</small><div>${escapeHtml(item.organization_name || "")}</div></div>
                        <div class="col-md-6"><small class="text-muted">Địa điểm</small><div>${escapeHtml(item.location_name || item.location_address || "Chưa cập nhật")}</div></div>
                        <div class="col-md-6"><small class="text-muted">Bắt đầu</small><div id="conferenceStartTime">${escapeHtml(formatDateTime(item.start_time))}</div></div>
                        <div class="col-md-6"><small class="text-muted">Kết thúc</small><div id="conferenceEndTime">${escapeHtml(formatDateTime(item.end_time))}</div></div>
                        <div id="rescheduleProposalDisplay" class="col-12 alert alert-info mb-0" ${item.proposed_start_time ? "" : "hidden"}><strong>Thời gian đề xuất dời:</strong> <span id="rescheduleProposalText">${item.proposed_start_time ? `${escapeHtml(formatDateTime(item.proposed_start_time))} – ${escapeHtml(formatDateTime(item.proposed_end_time))}${item.reschedule_note ? ` · ${escapeHtml(item.reschedule_note)}` : ""}` : ""}</span></div>
                        <div id="scheduleConflictPanel" class="col-12 alert alert-info admin-only mb-0" role="status" hidden>Đang kiểm tra lịch trùng...</div>
                        <div class="col-md-6"><small class="text-muted">Lý do từ chối / hủy</small><div>${escapeHtml(item.rejection_reason || item.cancel_reason || "—")}</div></div>
                        <div class="col-md-6"><small class="text-muted">Số người dự kiến</small><div>${escapeHtml(item.expected_participants ?? 0)}</div></div>
                        <div class="col-12"><small class="text-muted">Nội dung / mục đích</small><div>${escapeHtml(item.description || "Chưa cập nhật")}</div></div>
                        <div class="col-12">
                            <small class="text-muted">Tệp đính kèm</small>
                            <div id="conferenceAttachments" class="mt-2"><span class="text-muted">Đang tải danh sách tệp...</span></div>
                            <div class="mt-2 d-flex flex-wrap align-items-center gap-2">
                                <input id="attachmentUploadInput" type="file" class="form-control" multiple style="max-width: 420px" aria-label="Chọn tệp đính kèm">
                                <button id="uploadAttachmentsButton" type="button" class="btn btn-outline-primary">Tải tệp lên</button>
                                <span id="attachmentUploadMessage" class="small" role="status"></span>
                            </div>
                            <div class="form-text">Mỗi tệp tối đa 20 MB. Tệp được lưu trên máy chủ dùng chung.</div>
                        </div>
                        <div class="col-12 border-top pt-3">
                            <h5 class="mb-2">Phân công nhiệm vụ</h5>
                            <div id="conferenceAssignments" class="mb-3"><span class="text-muted">Đang tải phân công...</span></div>
                            <form id="assignmentForm" class="row g-2 admin-only mb-3">
                                <div class="col-md-4"><label class="form-label" for="assignmentTitle">Nhiệm vụ</label><input id="assignmentTitle" class="form-control" maxlength="200" required></div>
                                <div class="col-md-3"><label class="form-label" for="assignmentAssignee">Người nhận</label><input id="assignmentAssignee" class="form-control" maxlength="200" required></div>
                                <div class="col-md-3"><label class="form-label" for="assignmentOrganization">Đơn vị</label><input id="assignmentOrganization" class="form-control" maxlength="255"></div>
                                <div class="col-md-2"><label class="form-label" for="assignmentDueAt">Hạn hoàn thành</label><input id="assignmentDueAt" type="datetime-local" class="form-control"></div>
                                <div class="col-md-9"><label class="form-label" for="assignmentDescription">Mô tả</label><input id="assignmentDescription" class="form-control" maxlength="2000"></div>
                                <div class="col-md-3 d-flex align-items-end"><button class="btn btn-primary w-100" type="submit">Giao nhiệm vụ</button></div>
                                <div id="assignmentMessage" class="small" role="status"></div>
                            </form>
                        </div>
                        <div class="col-12 border-top pt-3">
                            <h5 class="mb-2">Phân công báo cáo viên</h5>
                            <div id="conferenceSpeakers" class="mb-3"><span class="text-muted">Đang tải báo cáo viên...</span></div>
                            <form id="speakerForm" class="row g-2 admin-only mb-3">
                                <div class="col-md-3"><label class="form-label" for="speakerName">Họ tên báo cáo viên</label><input id="speakerName" class="form-control" maxlength="200" required></div>
                                <div class="col-md-3"><label class="form-label" for="speakerOrganization">Đơn vị</label><input id="speakerOrganization" class="form-control" maxlength="255"></div>
                                <div class="col-md-3"><label class="form-label" for="speakerRole">Chức vụ</label><input id="speakerRole" class="form-control" maxlength="160"></div>
                                <div class="col-md-3"><label class="form-label" for="speakerTopic">Chuyên đề trình bày</label><input id="speakerTopic" class="form-control" maxlength="255" required></div>
                                <div class="col-md-2"><label class="form-label" for="speakerOrder">Thứ tự</label><input id="speakerOrder" type="number" min="1" value="1" class="form-control" required></div>
                                <div class="col-md-2"><label class="form-label" for="speakerDuration">Thời lượng (phút)</label><input id="speakerDuration" type="number" min="1" max="600" value="30" class="form-control" required></div>
                                <div class="col-md-6"><label class="form-label" for="speakerNotes">Ghi chú</label><input id="speakerNotes" class="form-control" maxlength="2000"></div>
                                <div class="col-md-2 d-flex align-items-end"><button class="btn btn-primary w-100" type="submit">Thêm báo cáo viên</button></div>
                                <div id="speakerMessage" class="small" role="status"></div>
                            </form>
                        </div>
                        <div class="col-12"><small class="text-muted">Lịch sử xử lý</small><div id="statusHistory" class="mt-2"><span class="text-muted">Đang tải...</span></div></div>
                        <div class="col-12 border-top pt-3 d-flex flex-wrap align-items-end gap-2 admin-only">
                            <div><label for="statusEdit" class="form-label mb-1">Cập nhật trạng thái</label><select id="statusEdit" class="form-select">
                                <option value="PENDING">Chờ phê duyệt</option><option value="APPROVED">Đã phê duyệt</option><option value="COMPLETED">Hoàn thành</option><option value="REJECTED">Từ chối</option><option value="CANCELLED">Đã hủy</option><option value="RESCHEDULED">Đề xuất dời lịch</option>
                            </select></div>
                            <div id="rescheduleFields" class="row g-2 w-100 admin-only" hidden>
                                <div class="col-md-4"><label for="proposedStartTime" class="form-label">Ngày giờ đề xuất bắt đầu</label><input id="proposedStartTime" type="datetime-local" class="form-control"></div>
                                <div class="col-md-4"><label for="proposedEndTime" class="form-label">Ngày giờ đề xuất kết thúc</label><input id="proposedEndTime" type="datetime-local" class="form-control"></div>
                                <div class="col-md-4"><label for="rescheduleNote" class="form-label">Ghi chú đề xuất</label><input id="rescheduleNote" class="form-control" maxlength="1000" placeholder="Ví dụ: chuyển sang buổi chiều"></div>
                            </div>
                            <button id="saveStatus" type="button" class="btn btn-primary">Lưu trạng thái</button>
                            <span id="detailActionMessage" class="small" role="status"></span>
                        </div>
                    </div>`;
                if (currentUser?.role !== "ADMIN") body.querySelectorAll(".admin-only").forEach(element => { element.hidden = true; });
                document.getElementById("statusEdit").value = item.status || "PENDING";
                const localDateTimeValue = value => {
                    if (!value) return "";
                    const date = new Date(value);
                    if (Number.isNaN(date.getTime())) return "";
                    const offset = date.getTimezoneOffset() * 60000;
                    return new Date(date.getTime() - offset).toISOString().slice(0, 16);
                };
                document.getElementById("proposedStartTime").value = localDateTimeValue(item.proposed_start_time);
                document.getElementById("proposedEndTime").value = localDateTimeValue(item.proposed_end_time);
                document.getElementById("rescheduleNote").value = item.reschedule_note || "";
                document.getElementById("rescheduleFields").hidden = item.status !== "RESCHEDULED";
                document.getElementById("statusEdit").addEventListener("change", event => {
                    document.getElementById("rescheduleFields").hidden = event.target.value !== "RESCHEDULED";
                });
                document.getElementById("saveStatus").addEventListener("click", () => saveConferenceStatus(item.id));
                document.getElementById("uploadAttachmentsButton").addEventListener("click", () => addConferenceAttachments(item.id));
                document.getElementById("assignmentForm").addEventListener("submit", event => createConferenceTask(event, item.id));
                document.getElementById("speakerForm").addEventListener("submit", event => createConferenceSpeakerEntry(event, item.id));
                if (currentUser?.role === "ADMIN") renderScheduleConflicts(item.id);
                renderConferenceAttachments(item.id);
                renderConferenceAssignments(item.id);
                renderConferenceSpeakers(item.id);
                renderStatusHistory(item.id);
            } catch (error) {
                body.innerHTML = `<div class="alert alert-danger mb-0">${escapeHtml(error.message || "Không tải được chi tiết hội nghị.")}</div>`;
            }
        }

        async function addConferenceAttachments(conferenceId) {
            const input = document.getElementById("attachmentUploadInput");
            const button = document.getElementById("uploadAttachmentsButton");
            const message = document.getElementById("attachmentUploadMessage");
            const files = Array.from(input.files || []);
            if (!files.length) {
                message.className = "small text-danger";
                message.textContent = "Hãy chọn ít nhất một tệp.";
                return;
            }
            const oversized = files.find(file => file.size > 20 * 1024 * 1024);
            if (oversized) {
                message.className = "small text-danger";
                message.textContent = `Tệp “${oversized.name}” vượt quá giới hạn 20 MB.`;
                return;
            }
            button.disabled = true;
            message.className = "small text-muted";
            message.textContent = "Đang tải tệp lên...";
            try {
                const results = await Promise.allSettled(files.map(file => uploadConferenceAttachment(conferenceId, file)));
                const uploaded = results.filter(result => result.status === "fulfilled").length;
                const failed = results.length - uploaded;
                await renderConferenceAttachments(conferenceId);
                if (failed) {
                    message.className = "small text-danger";
                    message.textContent = `Đã tải ${uploaded}/${files.length} tệp. ${failed} tệp lỗi; chọn lại tệp lỗi để thử lại.`;
                } else {
                    input.value = "";
                    message.className = "small text-success";
                    message.textContent = `Đã tải lên ${uploaded} tệp.`;
                }
            } catch (error) {
                message.className = "small text-danger";
                message.textContent = error.message || "Không tải được tệp.";
            } finally {
                button.disabled = false;
            }
        }

        async function renderScheduleConflicts(conferenceId) {
            const panel = document.getElementById("scheduleConflictPanel");
            if (!panel) return;
            panel.hidden = false;
            panel.className = "col-12 alert alert-info admin-only mb-0";
            panel.textContent = "Đang kiểm tra lịch trùng...";
            try {
                const result = await getConferenceScheduleConflicts(conferenceId);
                const conflicts = result.data || [];
                panel.replaceChildren();
                if (!conflicts.length) {
                    panel.className = "col-12 alert alert-success admin-only mb-0";
                    panel.textContent = "Không phát hiện trùng ngày tổ chức, khung giờ và địa điểm hoặc nhân sự với hội nghị đã được phê duyệt. Hồ sơ chờ phê duyệt được bỏ qua.";
                    return;
                }
                panel.className = "col-12 alert alert-warning admin-only mb-0";
                const title = document.createElement("strong");
                title.textContent = `Cảnh báo: có ${conflicts.length} hội nghị đã phê duyệt trùng ngày tổ chức, khung giờ/địa điểm hoặc nhân sự. Mỗi mục bên dưới kèm ngày giờ và địa điểm. Cảnh báo không chặn đăng ký hoặc phê duyệt.`;
                panel.appendChild(title);
                const list = document.createElement("ul");
                list.className = "mb-0 mt-2";
                conflicts.forEach(conflict => {
                    const item = document.createElement("li");
                    const types = (conflict.conflict_types || []).map(type => {
                        if (type === "DAY") return "Trùng ngày tổ chức";
                        if (type === "VENUE") return "Trùng khung giờ và địa điểm";
                        return "Trùng báo cáo viên/viên chức";
                    });
                    const people = (conflict.matched_people || []).map(person => person.name).join(", ");
                    item.textContent = `${types.join("; ")} · ${conflict.code || "Không có mã"} · ${conflict.title} · Ngày giờ: ${formatDateTime(conflict.start_time)}–${formatDateTime(conflict.end_time)} · Địa điểm: ${conflict.location_name || conflict.location_address || "Chưa có địa điểm"}${people ? ` · Nhân sự trùng: ${people}` : ""}${conflict.organization_name ? ` · ${conflict.organization_name}` : ""}`;
                    list.appendChild(item);
                });
                panel.appendChild(list);
            } catch (error) {
                panel.className = "col-12 alert alert-secondary admin-only mb-0";
                panel.textContent = `Chưa kiểm tra được lịch trùng: ${error.message || "lỗi kết nối"}. Việc đăng ký không bị ảnh hưởng.`;
            }
        }

        function showAssignmentMessage(id, text, success = false) {
            const element = document.getElementById(id);
            if (!element) return;
            element.className = `small ${success ? "text-success" : "text-danger"}`;
            element.textContent = text;
        }

        async function createConferenceTask(event, conferenceId) {
            event.preventDefault();
            const form = event.currentTarget;
            const due = document.getElementById("assignmentDueAt").value;
            const button = form.querySelector('button[type="submit"]');
            button.disabled = true;
            try {
                await createConferenceAssignment(conferenceId, {
                    title: document.getElementById("assignmentTitle").value.trim(),
                    assignee_name: document.getElementById("assignmentAssignee").value.trim(),
                    assignee_organization: document.getElementById("assignmentOrganization").value.trim(),
                    description: document.getElementById("assignmentDescription").value.trim(),
                    due_at: due ? new Date(due).toISOString() : null
                });
                form.reset();
                showAssignmentMessage("assignmentMessage", "Đã giao nhiệm vụ.", true);
                await renderScheduleConflicts(conferenceId);
                await renderConferenceAssignments(conferenceId);
            } catch (error) { showAssignmentMessage("assignmentMessage", error.message || "Không giao được nhiệm vụ."); }
            finally { button.disabled = false; }
        }

        async function renderConferenceAssignments(conferenceId) {
            const container = document.getElementById("conferenceAssignments");
            if (!container) return;
            container.replaceChildren();
            try {
                const result = await getConferenceAssignments(conferenceId);
                const assignments = result.data || [];
                if (!assignments.length) { container.textContent = "Chưa có nhiệm vụ được phân công."; return; }
                let currentUser = null;
                try { currentUser = JSON.parse(localStorage.getItem("tgpl.user") || "null"); } catch { currentUser = null; }
                const canManage = currentUser?.role === "ADMIN";
                const statusLabels = { ASSIGNED: "Đã giao", IN_PROGRESS: "Đang thực hiện", COMPLETED: "Hoàn thành", CANCELLED: "Đã hủy" };
                assignments.forEach(assignment => {
                    const card = document.createElement("div");
                    card.className = "border rounded p-2 mb-2";
                    const heading = document.createElement("div");
                    heading.className = "fw-semibold";
                    heading.textContent = `${assignment.title} · ${assignment.assignee_name}${assignment.assignee_organization ? ` (${assignment.assignee_organization})` : ""}`;
                    card.appendChild(heading);
                    const details = document.createElement("div");
                    details.className = "small text-muted";
                    details.textContent = `${statusLabels[assignment.status] || assignment.status}${assignment.due_at ? ` · Hạn: ${formatDateTime(assignment.due_at)}` : " · Chưa đặt hạn"}${assignment.description ? ` · ${assignment.description}` : ""}`;
                    card.appendChild(details);
                    if (canManage) {
                        const controls = document.createElement("div");
                        controls.className = "mt-2 d-flex gap-2";
                        const status = document.createElement("select");
                        status.className = "form-select form-select-sm";
                        status.style.maxWidth = "190px";
                        Object.entries(statusLabels).forEach(([value, label]) => {
                            const option = document.createElement("option"); option.value = value; option.textContent = label; status.appendChild(option);
                        });
                        status.value = assignment.status;
                        const update = document.createElement("button"); update.type = "button"; update.className = "btn btn-sm btn-outline-primary"; update.textContent = "Cập nhật trạng thái";
                        update.addEventListener("click", async () => {
                            update.disabled = true;
                            try { await updateConferenceAssignmentStatus(conferenceId, assignment.id, status.value); await renderScheduleConflicts(conferenceId); await renderConferenceAssignments(conferenceId); }
                            catch (error) { showAssignmentMessage("assignmentMessage", error.message || "Không cập nhật được nhiệm vụ."); }
                            finally { update.disabled = false; }
                        });
                        const remove = document.createElement("button"); remove.type = "button"; remove.className = "btn btn-sm btn-outline-danger"; remove.textContent = "Xóa";
                        remove.addEventListener("click", async () => {
                            if (!confirm("Xóa nhiệm vụ này?")) return;
                            try { await deleteConferenceAssignment(conferenceId, assignment.id); await renderScheduleConflicts(conferenceId); await renderConferenceAssignments(conferenceId); }
                            catch (error) { showAssignmentMessage("assignmentMessage", error.message || "Không xóa được nhiệm vụ."); }
                        });
                        controls.append(status, update, remove); card.appendChild(controls);
                    }
                    container.appendChild(card);
                });
            } catch (error) { container.textContent = error.message || "Không tải được danh sách nhiệm vụ."; }
        }

        async function createConferenceSpeakerEntry(event, conferenceId) {
            event.preventDefault();
            const form = event.currentTarget;
            const button = form.querySelector('button[type="submit"]');
            button.disabled = true;
            try {
                await createConferenceSpeaker(conferenceId, {
                    full_name: document.getElementById("speakerName").value.trim(),
                    organization: document.getElementById("speakerOrganization").value.trim(),
                    role_title: document.getElementById("speakerRole").value.trim(),
                    presentation_title: document.getElementById("speakerTopic").value.trim(),
                    speaking_order: Number(document.getElementById("speakerOrder").value),
                    duration_minutes: Number(document.getElementById("speakerDuration").value),
                    notes: document.getElementById("speakerNotes").value.trim()
                });
                form.reset();
                document.getElementById("speakerOrder").value = "1";
                document.getElementById("speakerDuration").value = "30";
                showAssignmentMessage("speakerMessage", "Đã phân công báo cáo viên.", true);
                await renderScheduleConflicts(conferenceId);
                await renderConferenceSpeakers(conferenceId);
            } catch (error) { showAssignmentMessage("speakerMessage", error.message || "Không phân công được báo cáo viên."); }
            finally { button.disabled = false; }
        }

        async function renderConferenceSpeakers(conferenceId) {
            const container = document.getElementById("conferenceSpeakers");
            if (!container) return;
            container.replaceChildren();
            try {
                const result = await getConferenceSpeakers(conferenceId);
                const speakers = result.data || [];
                if (!speakers.length) { container.textContent = "Chưa có báo cáo viên được phân công."; return; }
                let currentUser = null;
                try { currentUser = JSON.parse(localStorage.getItem("tgpl.user") || "null"); } catch { currentUser = null; }
                speakers.forEach(speaker => {
                    const card = document.createElement("div"); card.className = "border rounded p-2 mb-2 d-flex justify-content-between align-items-start gap-2";
                    const details = document.createElement("div");
                    const heading = document.createElement("div"); heading.className = "fw-semibold";
                    heading.textContent = `${speaker.speaking_order}. ${speaker.full_name}${speaker.role_title ? ` · ${speaker.role_title}` : ""}`;
                    const topic = document.createElement("div"); topic.textContent = `${speaker.presentation_title} · ${speaker.duration_minutes} phút${speaker.organization ? ` · ${speaker.organization}` : ""}`;
                    details.append(heading, topic);
                    if (speaker.notes) { const notes = document.createElement("div"); notes.className = "small text-muted"; notes.textContent = speaker.notes; details.appendChild(notes); }
                    card.appendChild(details);
                    if (currentUser?.role === "ADMIN") {
                        const remove = document.createElement("button"); remove.type = "button"; remove.className = "btn btn-sm btn-outline-danger"; remove.textContent = "Xóa";
                        remove.addEventListener("click", async () => {
                            if (!confirm("Xóa phân công báo cáo viên này?")) return;
                            try { await deleteConferenceSpeaker(conferenceId, speaker.id); await renderScheduleConflicts(conferenceId); await renderConferenceSpeakers(conferenceId); }
                            catch (error) { showAssignmentMessage("speakerMessage", error.message || "Không xóa được báo cáo viên."); }
                        });
                        card.appendChild(remove);
                    }
                    container.appendChild(card);
                });
            } catch (error) { container.textContent = error.message || "Không tải được danh sách báo cáo viên."; }
        }

        async function saveConferenceStatus(id) {
            const button = document.getElementById("saveStatus");
            const message = document.getElementById("detailActionMessage");
            button.disabled = true;
            try {
                const status = document.getElementById("statusEdit").value;
                let reason = "";
                let scheduleProposal = {};
                if (["REJECTED", "CANCELLED"].includes(status)) {
                    reason = window.prompt(status === "REJECTED" ? "Nhập lý do từ chối hồ sơ:" : "Nhập lý do hủy hội nghị:") || "";
                    if (!reason.trim()) throw new Error("Cần nhập lý do để từ chối hoặc hủy.");
                }
                if (status === "RESCHEDULED") {
                    const proposedStart = document.getElementById("proposedStartTime").value;
                    const proposedEnd = document.getElementById("proposedEndTime").value;
                    if (!proposedStart || !proposedEnd || new Date(proposedEnd) <= new Date(proposedStart)) {
                        throw new Error("Vui lòng nhập ngày giờ đề xuất hợp lệ; thời điểm kết thúc phải sau thời điểm bắt đầu.");
                    }
                    scheduleProposal = {
                        proposed_start_time: new Date(proposedStart).toISOString(),
                        proposed_end_time: new Date(proposedEnd).toISOString(),
                        reschedule_note: document.getElementById("rescheduleNote").value.trim()
                    };
                }
                const result = await updateConferenceStatus(id, status, reason, scheduleProposal);
                document.getElementById("detailStatusBadge").innerHTML = getStatusBadge(result.data?.status || document.getElementById("statusEdit").value);
                if (result.data?.start_time) document.getElementById("conferenceStartTime").textContent = formatDateTime(result.data.start_time);
                if (result.data?.end_time) document.getElementById("conferenceEndTime").textContent = formatDateTime(result.data.end_time);
                const proposalDisplay = document.getElementById("rescheduleProposalDisplay");
                if (result.data?.proposed_start_time) {
                    document.getElementById("rescheduleProposalText").textContent = `${formatDateTime(result.data.proposed_start_time)} – ${formatDateTime(result.data.proposed_end_time)}${result.data.reschedule_note ? ` · ${result.data.reschedule_note}` : ""}`;
                    proposalDisplay.hidden = false;
                } else proposalDisplay.hidden = true;
                document.getElementById("rescheduleFields").hidden = status !== "RESCHEDULED";
                message.className = "small text-success";
                message.textContent = "Đã cập nhật trạng thái.";
                renderStatusHistory(id);
                await reloadConferences();
            } catch (error) {
                message.className = "small text-danger";
                message.textContent = error.message || "Không cập nhật được trạng thái.";
            } finally {
                button.disabled = false;
            }
        }

        async function renderStatusHistory(id) {
            try {
                const result = await getConferenceStatusHistory(id);
                const history = result.data || [];
                const panel = document.getElementById("statusHistory");
                if (!panel) return;
                panel.replaceChildren();
                if (!history.length) {
                    panel.textContent = "Chưa có lịch sử phê duyệt.";
                    return;
                }
                const list = document.createElement("ul");
                list.className = "list-group list-group-flush";
                history.forEach(entry => {
                    const item = document.createElement("li");
                    item.className = "list-group-item px-0";
                    item.textContent = `${formatDateTime(entry.changed_at)} · ${entry.changed_by_name || "Quản trị viên"} · ${entry.new_status}${entry.reason ? ` · ${entry.reason}` : ""}`;
                    list.appendChild(item);
                });
                panel.appendChild(list);
            } catch (error) {
                const panel = document.getElementById("statusHistory");
                if (panel) panel.textContent = "Không tải được lịch sử trạng thái.";
            }
        }

        async function reloadConferences() {
            const result = await getConferences();
            allConferences = result.data || [];
            applyFilters();
        }

        function exportConferencesCsv() {
            const fields = ["code", "title", "organization_name", "start_time", "end_time", "location_name", "expected_participants", "status"];
            const headers = ["Mã hội nghị", "Chủ đề", "Đơn vị", "Bắt đầu", "Kết thúc", "Địa điểm", "Số người dự kiến", "Trạng thái"];
            const cell = value => {
                let text = String(value ?? "");
                if (/^[=+@\-\t\r]/.test(text)) text = `'${text}`;
                return `"${text.replace(/"/g, '""')}"`;
            };
            const csv = "\uFEFF" + [headers, ...visibleConferences.map(item => fields.map(key => item[key]))]
                .map(row => row.map(cell).join(",")).join("\r\n");
            const url = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
            const link = document.createElement("a");
            link.href = url;
            link.download = `hoi-nghi-tgpl-${new Date().toISOString().slice(0, 10)}.csv`;
            link.click();
            URL.revokeObjectURL(url);
        }

        async function renderConferenceAttachments(conferenceId) {
            const list = document.getElementById("conferenceAttachments");
            if (!list) return;
            try {
                const attachments = await getConferenceAttachments(conferenceId);
                list.replaceChildren();
                if (!attachments.length) {
                    list.textContent = "Chưa có tệp đính kèm.";
                    return;
                }
                attachments.forEach(function (attachment) {
                    const button = document.createElement("button");
                    button.type = "button";
                    button.className = "btn btn-sm btn-outline-primary me-2 mb-2";
                    button.textContent = `${attachment.name || attachment.file_name || "Tệp"} (${formatFileSize(attachment.size || attachment.file_size || 0)})`;
                    button.addEventListener("click", function () {
                        openConferenceAttachment(attachment).catch(error => alert(error.message));
                    });
                    list.appendChild(button);
                });
            } catch (error) {
                list.textContent = error.message || "Không tải được danh sách tệp.";
            }
        }


        // ==================================================
        // BỘ LỌC
        // ==================================================

        function setupFilters() {

            const searchInput =
                document.getElementById(
                    "searchInput"
                );


            const statusFilter =
                document.getElementById(
                    "statusFilter"
                );


            const resetButton =
                document.getElementById(
                    "resetFilter"
                );


            searchInput.addEventListener(
                "input",
                applyFilters
            );


            statusFilter.addEventListener(
                "change",
                applyFilters
            );


            resetButton.addEventListener(
                "click",
                function () {

                    searchInput.value = "";

                    statusFilter.value = "";

                    renderConferences(
                        allConferences
                    );

                }
            );

            document.getElementById("exportCsv").addEventListener("click", exportConferencesCsv);

        }


        function applyFilters() {

            const keyword =
                document.getElementById(
                    "searchInput"
                ).value
                .trim()
                .toLowerCase();


            const status =
                document.getElementById(
                    "statusFilter"
                ).value;


            const filtered =
                allConferences.filter(
                    function (conference) {

                        const code =
                            String(
                                conference.code || ""
                            ).toLowerCase();


                        const title =
                            String(
                                conference.title || ""
                            ).toLowerCase();


                        const matchesKeyword =
                            !keyword ||
                            code.includes(keyword) ||
                            title.includes(keyword);


                        const matchesStatus =
                            !status ||
                            conference.status === status;


                        return (
                            matchesKeyword &&
                            matchesStatus
                        );

                    }
                );


            renderConferences(
                filtered
            );

        }


        // ==================================================
        // TRẠNG THÁI
        // ==================================================

        function getStatusBadge(status) {

            const statusMap = {

                PENDING: {
                    text: "Chờ phê duyệt",
                    className:
                        "bg-warning text-dark"
                },

                APPROVED: {
                    text: "Đã phê duyệt",
                    className:
                        "bg-success"
                },

                COMPLETED: {
                    text: "Hoàn thành",
                    className:
                        "bg-primary"
                },

                REJECTED: {
                    text: "Từ chối",
                    className:
                        "bg-danger"
                },

                CANCELLED: {
                    text: "Đã hủy",
                    className:
                        "bg-secondary"
                },

                RESCHEDULED: {
                    text: "Đề xuất dời lịch",
                    className:
                        "bg-info text-dark"
                }

            };


            const item =
                statusMap[status] || {

                    text:
                        status ||
                        "Không xác định",

                    className:
                        "bg-secondary"

                };


            return `

                <span
                    class="badge ${item.className}">

                    ${item.text}

                </span>

            `;

        }


        // ==================================================
        // ĐỊNH DẠNG NGÀY GIỜ
        // ==================================================

        function formatDateTime(value) {

            if (!value) {

                return "";

            }


            const date =
                new Date(value);


            if (
                Number.isNaN(
                    date.getTime()
                )
            ) {

                return value;

            }


            return date.toLocaleString(
                "vi-VN",
                {

                    day: "2-digit",

                    month: "2-digit",

                    year: "numeric",

                    hour: "2-digit",

                    minute: "2-digit"

                }
            );

        }


        // ==================================================
        // XỬ LÝ HTML
        // ==================================================

        function escapeHtml(value) {

            if (
                value === null ||
                value === undefined
            ) {

                return "";

            }


            return String(value)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        // ==================================================
        // LỖI
        // ==================================================

        function showListError(error) {

            const errorElement =
                document.getElementById(
                    "connectionError"
                );


            if (!errorElement) {

                return;

            }


            errorElement.innerHTML = `

                <div
                    class="alert alert-danger">

                    <strong>
                        Không tải được danh sách hội nghị.
                    </strong>

                    <br>

                    ${escapeHtml(
                        error.message ||
                        "Lỗi không xác định"
                    )}

                </div>

            `;


            errorElement.style.display =
                "block";

        }

    </script>
