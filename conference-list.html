<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Danh sách hội nghị - TGPL Đồng Nai</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="assets/css/style.css">
</head>

<body>

    <!-- HEADER -->
    <nav class="navbar navbar-dark bg-primary">
        <div class="container-fluid">

            <span class="navbar-brand mb-0 h1">
                Phần mềm quản lý hội nghị TGPL
            </span>

            <a
                href="index.html"
                class="btn btn-light btn-sm">
                Dashboard
            </a>
            <a href="organizations.html" class="btn btn-outline-light btn-sm ms-2">Quản lý đơn vị</a>

        </div>
    </nav>


    <!-- MAIN -->
    <div class="container-fluid mt-4">

        <div class="d-flex justify-content-between align-items-center mb-3">

            <div>
                <h3>Danh sách hội nghị</h3>

                <p class="text-muted mb-0">
                    Quản lý các hội nghị đã đăng ký trên hệ thống
                </p>
            </div>

            <a
                href="create-conference.html"
                class="btn btn-primary">

                + Đăng ký hội nghị

            </a>

        </div>


        <!-- THÔNG BÁO -->
        <div id="connectionError"
             style="display:none;">
        </div>

        <section id="conferenceDetail" class="card mb-4" hidden aria-live="polite">
            <div class="card-header d-flex justify-content-between align-items-center">
                <strong>Chi tiết hội nghị</strong>
                <button id="closeDetail" type="button" class="btn btn-sm btn-outline-secondary">Đóng</button>
            </div>
            <div id="conferenceDetailBody" class="card-body"></div>
        </section>


        <!-- BỘ LỌC -->
        <div class="card mb-4">

            <div class="card-header">
                Bộ lọc
            </div>

            <div class="card-body">

                <div class="row g-3">

                    <div class="col-md-4">

                        <label
                            for="searchInput"
                            class="form-label">

                            Tìm kiếm

                        </label>

                        <input
                            type="text"
                            id="searchInput"
                            class="form-control"
                            placeholder="Mã hoặc chủ đề hội nghị">

                    </div>


                    <div class="col-md-3">

                        <label
                            for="statusFilter"
                            class="form-label">

                            Trạng thái

                        </label>

                        <select
                            id="statusFilter"
                            class="form-select">

                            <option value="">
                                Tất cả
                            </option>

                            <option value="PENDING">
                                Chờ phê duyệt
                            </option>

                            <option value="APPROVED">
                                Đã phê duyệt
                            </option>

                            <option value="COMPLETED">
                                Hoàn thành
                            </option>

                            <option value="REJECTED">
                                Từ chối
                            </option>

                            <option value="CANCELLED">
                                Đã hủy
                            </option>

                        </select>

                    </div>


                    <div class="col-md-2 d-flex align-items-end">

                        <button
                            id="resetFilter"
                            class="btn btn-secondary w-100">

                            Xóa lọc

                        </button>

                    </div>

                </div>

            </div>

        </div>


        <!-- DANH SÁCH -->
        <div class="card">

            <div class="card-header d-flex justify-content-between">

                <div class="d-flex align-items-center gap-2">
                    Danh sách hội nghị
                    <a href="organizations.html" class="btn btn-sm btn-outline-primary">Đơn vị</a>
                    <button id="exportCsv" type="button" class="btn btn-sm btn-outline-success">Xuất CSV</button>
                </div>

                <span
                    id="conferenceCount"
                    class="badge bg-primary">

                    0

                </span>

            </div>


            <div class="card-body">

                <div class="table-responsive">

                    <table
                        class="table table-bordered table-hover align-middle">

                        <thead class="table-light">

                            <tr>

                                <th>
                                    Mã
                                </th>

                                <th>
                                    Chủ đề
                                </th>

                                <th>
                                    Đơn vị
                                </th>

                                <th>
                                    Thời gian
                                </th>

                                <th>
                                    Số người dự kiến
                                </th>

                                <th>
                                    Trạng thái
                                </th>

                                <th
                                    style="width:120px;">
                                    Thao tác
                                </th>

                            </tr>

                        </thead>


                        <tbody id="conferenceTableBody">

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>


    <!-- JAVASCRIPT -->

    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/attachments.js?v=20261003-3"></script>
    <script src="assets/js/auth.js"></script>


    <script>

        let allConferences = [];
        let visibleConferences = [];


        // ==================================================
        // KHỞI TẠO
        // ==================================================

        document.addEventListener(
            "DOMContentLoaded",
            async function () {

                console.log(
                    "Đang tải danh sách hội nghị..."
                );


                try {

                    const result =
                        await getConferences();


                    console.log(
                        "Danh sách hội nghị:",
                        result
                    );


                    allConferences =
                        result.data || [];


                    renderConferences(
                        allConferences
                    );


                    setupFilters();
                    loadConferenceDetailFromUrl();


                } catch (error) {

                    console.error(
                        "Lỗi tải danh sách hội nghị:",
                        error
                    );


                    showListError(error);

                }

            }
        );


        // ==================================================
        // HIỂN THỊ DANH SÁCH
        // ==================================================

        function renderConferences(
            conferences
        ) {

            const tableBody =
                document.getElementById(
                    "conferenceTableBody"
                );


            const countElement =
                document.getElementById(
                    "conferenceCount"
                );


            if (!tableBody) {

                return;

            }


            tableBody.innerHTML = "";
            visibleConferences = [...conferences];


            if (countElement) {

                countElement.textContent =
                    conferences.length;

            }


            if (
                conferences.length === 0
            ) {

                tableBody.innerHTML = `

                    <tr>

                        <td
                            colspan="7"
                            class="text-center text-muted">

                            Không có hội nghị phù hợp.

                        </td>

                    </tr>

                `;

                return;

            }


            conferences.forEach(
                function (conference) {

                    const row =
                        document.createElement("tr");


                    row.innerHTML = `

                        <td>
                            ${escapeHtml(
                                conference.code || ""
                            )}
                        </td>


                        <td>
                            ${escapeHtml(
                                conference.title || ""
                            )}
                        </td>


                        <td>
                            ${escapeHtml(
                                conference.organization_name ||
                                conference.organization_id ||
                                ""
                            )}
                        </td>


                        <td>
                            ${formatDateTime(
                                conference.start_time
                            )}

                            <br>

                            <small
                                class="text-muted">

                                đến

                                ${formatDateTime(
                                    conference.end_time
                                )}

                            </small>

                        </td>


                        <td>
                            ${escapeHtml(
                                conference.expected_participants ??
                                ""
                            )}
                        </td>


                        <td>
                            ${getStatusBadge(
                                conference.status
                            )}
                        </td>


                        <td>

                            <a
                                href="conference-list.html?id=${encodeURIComponent(
                                    conference.id
                                )}"
                                class="btn btn-sm btn-primary">

                                Xem

                            </a>

                        </td>

                    `;


                    tableBody.appendChild(row);

                }
            );

        }

        async function loadConferenceDetailFromUrl() {
            const id = new URLSearchParams(window.location.search).get("id");
            if (!id) return;
            const panel = document.getElementById("conferenceDetail");
            const body = document.getElementById("conferenceDetailBody");
            panel.hidden = false;
            body.innerHTML = '<p class="text-muted mb-0">Đang tải thông tin...</p>';
            document.getElementById("closeDetail").addEventListener("click", function () {
                panel.hidden = true;
                history.replaceState({}, "", "conference-list.html");
            }, { once: true });
            try {
                const result = await getConference(id);
                const item = result.data || result;
                body.innerHTML = `
                    <div class="row g-3">
                        <div class="col-md-6"><small class="text-muted">Mã hội nghị</small><div class="fw-semibold">${escapeHtml(item.code || "")}</div></div>
                        <div class="col-md-6"><small class="text-muted">Trạng thái</small><div id="detailStatusBadge">${getStatusBadge(item.status)}</div></div>
                        <div class="col-md-12"><small class="text-muted">Chủ đề</small><div class="fw-semibold">${escapeHtml(item.title || "")}</div></div>
                        <div class="col-md-6"><small class="text-muted">Đơn vị đăng ký</small><div>${escapeHtml(item.organization_name || "")}</div></div>
                        <div class="col-md-6"><small class="text-muted">Địa điểm</small><div>${escapeHtml(item.location_name || item.location_address || "Chưa cập nhật")}</div></div>
                        <div class="col-md-6"><small class="text-muted">Bắt đầu</small><div>${escapeHtml(formatDateTime(item.start_time))}</div></div>
                        <div class="col-md-6"><small class="text-muted">Kết thúc</small><div>${escapeHtml(formatDateTime(item.end_time))}</div></div>
                        <div class="col-md-6"><small class="text-muted">Lý do từ chối / hủy</small><div>${escapeHtml(item.rejection_reason || item.cancel_reason || "—")}</div></div>
                        <div class="col-md-6"><small class="text-muted">Số người dự kiến</small><div>${escapeHtml(item.expected_participants ?? 0)}</div></div>
                        <div class="col-12"><small class="text-muted">Nội dung / mục đích</small><div>${escapeHtml(item.description || "Chưa cập nhật")}</div></div>
                        <div class="col-12">
                            <small class="text-muted">Tệp đính kèm</small>
                            <div id="conferenceAttachments" class="mt-2"><span class="text-muted">Đang tải danh sách tệp...</span></div>
                            <div class="mt-2 d-flex flex-wrap align-items-center gap-2">
                                <input id="attachmentUploadInput" type="file" class="form-control" multiple style="max-width: 420px" aria-label="Chọn tệp đính kèm">
                                <button id="uploadAttachmentsButton" type="button" class="btn btn-outline-primary">Tải tệp lên</button>
                                <span id="attachmentUploadMessage" class="small" role="status"></span>
                            </div>
                            <div class="form-text">Mỗi tệp tối đa 20 MB. Tệp được lưu trên máy chủ dùng chung.</div>
                        </div>
                        <div class="col-12"><small class="text-muted">Lịch sử xử lý</small><div id="statusHistory" class="mt-2"><span class="text-muted">Đang tải...</span></div></div>
                        <div class="col-12 border-top pt-3 d-flex flex-wrap align-items-end gap-2 admin-only">
                            <div><label for="statusEdit" class="form-label mb-1">Cập nhật trạng thái</label><select id="statusEdit" class="form-select">
                                <option value="PENDING">Chờ phê duyệt</option><option value="APPROVED">Đã phê duyệt</option><option value="COMPLETED">Hoàn thành</option><option value="REJECTED">Từ chối</option><option value="CANCELLED">Đã hủy</option>
                            </select></div>
                            <button id="saveStatus" type="button" class="btn btn-primary">Lưu trạng thái</button>
                            <button id="deleteConference" type="button" class="btn btn-outline-danger ms-auto">Xóa hội nghị</button>
                            <span id="detailActionMessage" class="small" role="status"></span>
                        </div>
                    </div>`;
                document.getElementById("statusEdit").value = item.status || "PENDING";
                document.getElementById("saveStatus").addEventListener("click", () => saveConferenceStatus(item.id));
                document.getElementById("deleteConference").addEventListener("click", () => removeConference(item.id));
                document.getElementById("uploadAttachmentsButton").addEventListener("click", () => addConferenceAttachments(item.id));
                renderConferenceAttachments(item.id);
                renderStatusHistory(item.id);
            } catch (error) {
                body.innerHTML = `<div class="alert alert-danger mb-0">${escapeHtml(error.message || "Không tải được chi tiết hội nghị.")}</div>`;
            }
        }

        async function addConferenceAttachments(conferenceId) {
            const input = document.getElementById("attachmentUploadInput");
            const button = document.getElementById("uploadAttachmentsButton");
            const message = document.getElementById("attachmentUploadMessage");
            const files = Array.from(input.files || []);
            if (!files.length) {
                message.className = "small text-danger";
                message.textContent = "Hãy chọn ít nhất một tệp.";
                return;
            }
            const oversized = files.find(file => file.size > 20 * 1024 * 1024);
            if (oversized) {
                message.className = "small text-danger";
                message.textContent = `Tệp “${oversized.name}” vượt quá giới hạn 20 MB.`;
                return;
            }
            button.disabled = true;
            message.className = "small text-muted";
            message.textContent = "Đang tải tệp lên...";
            try {
                const results = await Promise.allSettled(files.map(file => uploadConferenceAttachment(conferenceId, file)));
                const uploaded = results.filter(result => result.status === "fulfilled").length;
                const failed = results.length - uploaded;
                await renderConferenceAttachments(conferenceId);
                if (failed) {
                    message.className = "small text-danger";
                    message.textContent = `Đã tải ${uploaded}/${files.length} tệp. ${failed} tệp lỗi; chọn lại tệp lỗi để thử lại.`;
                } else {
                    input.value = "";
                    message.className = "small text-success";
                    message.textContent = `Đã tải lên ${uploaded} tệp.`;
                }
            } catch (error) {
                message.className = "small text-danger";
                message.textContent = error.message || "Không tải được tệp.";
            } finally {
                button.disabled = false;
            }
        }

        async function saveConferenceStatus(id) {
            const button = document.getElementById("saveStatus");
            const message = document.getElementById("detailActionMessage");
            button.disabled = true;
            try {
                const status = document.getElementById("statusEdit").value;
                let reason = "";
                if (["REJECTED", "CANCELLED"].includes(status)) {
                    reason = window.prompt(status === "REJECTED" ? "Nhập lý do từ chối hồ sơ:" : "Nhập lý do hủy hội nghị:") || "";
                    if (!reason.trim()) throw new Error("Cần nhập lý do để từ chối hoặc hủy.");
                }
                const result = await updateConferenceStatus(id, status, reason);
                document.getElementById("detailStatusBadge").innerHTML = getStatusBadge(result.data?.status || document.getElementById("statusEdit").value);
                message.className = "small text-success";
                message.textContent = "Đã cập nhật trạng thái.";
                renderStatusHistory(id);
                await reloadConferences();
            } catch (error) {
                message.className = "small text-danger";
                message.textContent = error.message || "Không cập nhật được trạng thái.";
            } finally {
                button.disabled = false;
            }
        }

        async function renderStatusHistory(id) {
            try {
                const result = await getConferenceStatusHistory(id);
                const history = result.data || [];
                const panel = document.getElementById("statusHistory");
                if (!panel) return;
                panel.replaceChildren();
                if (!history.length) {
                    panel.textContent = "Chưa có lịch sử phê duyệt.";
                    return;
                }
                const list = document.createElement("ul");
                list.className = "list-group list-group-flush";
                history.forEach(entry => {
                    const item = document.createElement("li");
                    item.className = "list-group-item px-0";
                    item.textContent = `${formatDateTime(entry.changed_at)} · ${entry.changed_by_name || "Quản trị viên"} · ${entry.new_status}${entry.reason ? ` · ${entry.reason}` : ""}`;
                    list.appendChild(item);
                });
                panel.appendChild(list);
            } catch (error) {
                const panel = document.getElementById("statusHistory");
                if (panel) panel.textContent = "Không tải được lịch sử trạng thái.";
            }
        }

        async function removeConference(id) {
            if (!window.confirm("Xóa hội nghị này và các tệp đính kèm? Thao tác này không thể hoàn tác.")) return;
            const message = document.getElementById("detailActionMessage");
            try {
                await deleteConference(id);
                document.getElementById("conferenceDetail").hidden = true;
                history.replaceState({}, "", "conference-list.html");
                await reloadConferences();
            } catch (error) {
                message.className = "small text-danger";
                message.textContent = error.message || "Không xóa được hội nghị.";
            }
        }

        async function reloadConferences() {
            const result = await getConferences();
            allConferences = result.data || [];
            applyFilters();
        }

        function exportConferencesCsv() {
            const fields = ["code", "title", "organization_name", "start_time", "end_time", "location_name", "expected_participants", "status"];
            const headers = ["Mã hội nghị", "Chủ đề", "Đơn vị", "Bắt đầu", "Kết thúc", "Địa điểm", "Số người dự kiến", "Trạng thái"];
            const cell = value => {
                let text = String(value ?? "");
                if (/^[=+@\-\t\r]/.test(text)) text = `'${text}`;
                return `"${text.replace(/"/g, '""')}"`;
            };
            const csv = "\uFEFF" + [headers, ...visibleConferences.map(item => fields.map(key => item[key]))]
                .map(row => row.map(cell).join(",")).join("\r\n");
            const url = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
            const link = document.createElement("a");
            link.href = url;
            link.download = `hoi-nghi-tgpl-${new Date().toISOString().slice(0, 10)}.csv`;
            link.click();
            URL.revokeObjectURL(url);
        }

        async function renderConferenceAttachments(conferenceId) {
            const list = document.getElementById("conferenceAttachments");
            if (!list) return;
            try {
                const attachments = await getConferenceAttachments(conferenceId);
                list.replaceChildren();
                if (!attachments.length) {
                    list.textContent = "Chưa có tệp đính kèm.";
                    return;
                }
                attachments.forEach(function (attachment) {
                    const button = document.createElement("button");
                    button.type = "button";
                    button.className = "btn btn-sm btn-outline-primary me-2 mb-2";
                    button.textContent = `${attachment.name || attachment.file_name || "Tệp"} (${formatFileSize(attachment.size || attachment.file_size || 0)})`;
                    button.addEventListener("click", function () {
                        openConferenceAttachment(attachment).catch(error => alert(error.message));
                    });
                    list.appendChild(button);
                });
            } catch (error) {
                list.textContent = error.message || "Không tải được danh sách tệp.";
            }
        }


        // ==================================================
        // BỘ LỌC
        // ==================================================

        function setupFilters() {

            const searchInput =
                document.getElementById(
                    "searchInput"
                );


            const statusFilter =
                document.getElementById(
                    "statusFilter"
                );


            const resetButton =
                document.getElementById(
                    "resetFilter"
                );


            searchInput.addEventListener(
                "input",
                applyFilters
            );


            statusFilter.addEventListener(
                "change",
                applyFilters
            );


            resetButton.addEventListener(
                "click",
                function () {

                    searchInput.value = "";

                    statusFilter.value = "";

                    renderConferences(
                        allConferences
                    );

                }
            );

            document.getElementById("exportCsv").addEventListener("click", exportConferencesCsv);

        }


        function applyFilters() {

            const keyword =
                document.getElementById(
                    "searchInput"
                ).value
                .trim()
                .toLowerCase();


            const status =
                document.getElementById(
                    "statusFilter"
                ).value;


            const filtered =
                allConferences.filter(
                    function (conference) {

                        const code =
                            String(
                                conference.code || ""
                            ).toLowerCase();


                        const title =
                            String(
                                conference.title || ""
                            ).toLowerCase();


                        const matchesKeyword =
                            !keyword ||
                            code.includes(keyword) ||
                            title.includes(keyword);


                        const matchesStatus =
                            !status ||
                            conference.status === status;


                        return (
                            matchesKeyword &&
                            matchesStatus
                        );

                    }
                );


            renderConferences(
                filtered
            );

        }


        // ==================================================
        // TRẠNG THÁI
        // ==================================================

        function getStatusBadge(status) {

            const statusMap = {

                PENDING: {
                    text: "Chờ phê duyệt",
                    className:
                        "bg-warning text-dark"
                },

                APPROVED: {
                    text: "Đã phê duyệt",
                    className:
                        "bg-success"
                },

                COMPLETED: {
                    text: "Hoàn thành",
                    className:
                        "bg-primary"
                },

                REJECTED: {
                    text: "Từ chối",
                    className:
                        "bg-danger"
                },

                CANCELLED: {
                    text: "Đã hủy",
                    className:
                        "bg-secondary"
                }

            };


            const item =
                statusMap[status] || {

                    text:
                        status ||
                        "Không xác định",

                    className:
                        "bg-secondary"

                };


            return `

                <span
                    class="badge ${item.className}">

                    ${item.text}

                </span>

            `;

        }


        // ==================================================
        // ĐỊNH DẠNG NGÀY GIỜ
        // ==================================================

        function formatDateTime(value) {

            if (!value) {

                return "";

            }


            const date =
                new Date(value);


            if (
                Number.isNaN(
                    date.getTime()
                )
            ) {

                return value;

            }


            return date.toLocaleString(
                "vi-VN",
                {

                    day: "2-digit",

                    month: "2-digit",

                    year: "numeric",

                    hour: "2-digit",

                    minute: "2-digit"

                }
            );

        }


        // ==================================================
        // XỬ LÝ HTML
        // ==================================================

        function escapeHtml(value) {

            if (
                value === null ||
                value === undefined
            ) {

                return "";

            }


            return String(value)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        // ==================================================
        // LỖI
        // ==================================================

        function showListError(error) {

            const errorElement =
                document.getElementById(
                    "connectionError"
                );


            if (!errorElement) {

                return;

            }


            errorElement.innerHTML = `

                <div
                    class="alert alert-danger">

                    <strong>
                        Không tải được danh sách hội nghị.
                    </strong>

                    <br>

                    ${escapeHtml(
                        error.message ||
                        "Lỗi không xác định"
                    )}

                </div>

            `;


            errorElement.style.display =
                "block";

        }

    </script>
