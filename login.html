<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập - TGPL Đồng Nai</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-light">
    <main class="container py-5" style="max-width: 560px">
        <div class="text-center mb-4">
            <h2>Hệ thống quản lý hội nghị TGPL</h2>
            <p class="text-muted">Đăng nhập để tiếp tục</p>
        </div>
        <div id="authMessage" class="alert" hidden role="alert"></div>
        <section id="loginPanel" class="card" hidden>
            <div class="card-header">Đăng nhập</div>
            <form id="loginForm" class="card-body">
                <div class="mb-3"><label for="loginUsername" class="form-label">Tên đăng nhập</label><input id="loginUsername" class="form-control" autocomplete="username" required></div>
                <div class="mb-3"><label for="loginPassword" class="form-label">Mật khẩu</label><input id="loginPassword" type="password" class="form-control" autocomplete="current-password" required></div>
                <button class="btn btn-primary w-100" type="submit">Đăng nhập</button>
            </form>
        </section>
        <section id="setupPanel" class="card" hidden>
            <div class="card-header">Khởi tạo quản trị viên đầu tiên</div>
            <form id="setupForm" class="card-body">
                <p class="small text-muted">Chỉ thực hiện một lần trên máy chủ cục bộ. Tạo mật khẩu riêng tối thiểu 12 ký tự.</p>
                <div class="mb-3"><label for="setupFullName" class="form-label">Họ tên</label><input id="setupFullName" class="form-control" value="Quản trị hệ thống" required></div>
                <div class="mb-3"><label for="setupUsername" class="form-label">Tên đăng nhập</label><input id="setupUsername" class="form-control" value="admin" autocomplete="username" required></div>
                <div class="mb-3"><label for="setupPassword" class="form-label">Mật khẩu mới</label><input id="setupPassword" type="password" class="form-control" minlength="12" autocomplete="new-password" required></div>
                <button class="btn btn-primary w-100" type="submit">Tạo admin</button>
            </form>
        </section>
        <p class="text-center text-muted small mt-3">Vai trò admin xử lý duyệt hội nghị và quản lý tài khoản.</p>
    </main>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script>
        const message = document.getElementById("authMessage");
        const loginPanel = document.getElementById("loginPanel");
        const setupPanel = document.getElementById("setupPanel");
        const returnTo = new URLSearchParams(location.search).get("return");
        const safeReturn = returnTo && returnTo.startsWith("/") && !returnTo.startsWith("//") && !returnTo.includes("login.html")
            ? returnTo : "index.html";

        function showMessage(text, type = "danger") {
            message.className = `alert alert-${type}`;
            message.textContent = text;
            message.hidden = false;
        }
        function saveSession(result) {
            localStorage.setItem("tgpl.accessToken", result.token);
            localStorage.setItem("tgpl.user", JSON.stringify(result.user));
            location.replace(safeReturn);
        }
        async function initialize() {
            if (!window.TGPL_AUTH_ENABLED) {
                showMessage("Chưa cấu hình API dùng chung. Hãy mở ứng dụng tại localhost hoặc cấu hình API của backend.", "warning");
                return;
            }
            if (localStorage.getItem("tgpl.accessToken")) {
                try { await getCurrentUser(); location.replace(safeReturn); return; }
                catch { localStorage.removeItem("tgpl.accessToken"); localStorage.removeItem("tgpl.user"); }
            }
            try {
                const result = await getAuthStatus();
                setupPanel.hidden = !result.setup_required;
                loginPanel.hidden = result.setup_required;
            } catch (error) { showMessage(error.message || "Không kết nối được backend."); }
        }
        document.getElementById("loginForm").addEventListener("submit", async event => {
            event.preventDefault();
            const button = event.submitter;
            button.disabled = true;
            try { saveSession(await loginUser(document.getElementById("loginUsername").value.trim(), document.getElementById("loginPassword").value)); }
            catch (error) { showMessage(error.message || "Đăng nhập không thành công."); }
            finally { button.disabled = false; }
        });
        document.getElementById("setupForm").addEventListener("submit", async event => {
            event.preventDefault();
            const button = event.submitter;
            button.disabled = true;
            try {
                saveSession(await setupAdminUser(
                    document.getElementById("setupUsername").value.trim(),
                    document.getElementById("setupFullName").value.trim(),
                    document.getElementById("setupPassword").value
                ));
            } catch (error) { showMessage(error.message || "Không thể khởi tạo admin."); }
            finally { button.disabled = false; }
        });
        initialize();
    </script>
</body>
</html>
